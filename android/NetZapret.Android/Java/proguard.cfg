# Java-часть NetZapret: C# находит NzBox по имени через JNI (NzBoxBridge),
# службы и плитку — система по манифесту. Сжатие R8 без этих правил
# переименовало бы или выбросило их, и APK падал бы только в Release.
-keep class org.netzapret.android.** { *; }

# libbox (gomobile): Go вызывает методы Java по именам через JNI. Те же правила
# лежат в proguard.txt внутри libbox.aar — здесь на случай, если его не подхватят.
-keep class go.** { *; }
-keep class io.nekohasekai.** { *; }
