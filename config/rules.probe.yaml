# Конфиг для сквозной проверки цепочки «правило → сервер → трафик».
#
# Службы определения внешнего адреса уводятся на конкретный рабочий сервер,
# всё остальное идёт напрямую. Если после запуска
#   curl --proxy http://127.0.0.1:21080 https://api.ipify.org
# вернёт не тот адрес, что без прокси, — работает вся цепочка целиком:
# разбор ссылки, генерация конфига, маршрутизация по правилу и транспорт.
#
# Имя сервера подставьте своё: список даёт netzapret sub, рабочие
# отбирает netzapret probe.

mode: selective

rules:
  - match: domain
    value: "api.ipify.org"
    mode: proxy
    server: "🇷🇺 Hysteria2 | Россия"

  - match: domain
    value: "ifconfig.me"
    mode: proxy
    server: "🇷🇺 Hysteria2 | Россия"

default:
  mode: direct
