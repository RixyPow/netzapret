# Адреса для имён, у которых своего адреса нет.
#
# Обычно такое чинить нечем: ни десинк, ни туннель не помогут соединиться
# с именем, которого не существует. Здесь можно назвать адрес самим.
#
# Формат: имя и адрес через двоеточие.
#
#   tr.rbxcdn.com: 18.165.140.49
#
# Работает через собственный резолвер, файл hosts не трогается. Это важно:
# hosts системный, правки в нём требуют прав администратора и переживают
# удаление программы, а здесь всё снимается одной строкой.
#
# Адреса сетей доставки не вечны. Если превью снова пропали, значит адрес
# сменился — возьмите свежий с живого шарда того же CDN:
#
#   curl -sS -o /dev/null -w "%{remote_ip}\n" https://t0.rbxcdn.com/

# ── Почему здесь пусто ────────────────────────────────────────────────────
#
# Постоянных подстановок мы больше не поставляем, и причина — замеры.
#
# tr.rbxcdn.com. Стоял здесь как «имя без адреса»: CNAME на trns1.rbxcdn.com,
# у которого записи A не было ни у одного резолвера. Проверка 2026-09-03
# показала, что Roblox перевёл имя на Akamai — цепочка разрешается до конца,
# адрес есть, и наша строка теперь не помогала бы, а замораживала прежний
# узел CloudFront вместо рабочего.
#
# image.tmdb.org. Сеть доставки по-прежнему отшивает регион петлёй, но адрес
# живого шарда сменился трижды за четверо суток: 169.150.247.34, затем .39,
# затем 138.199.36.8. Число, вписанное в релиз, устареет раньше, чем его
# скачают. Устойчив не адрес, а то, что один резолвер врёт, а другой нет.
#
# ── Что вместо этого ──────────────────────────────────────────────────────
#
# Меню «Сервисы и маршруты» → нужный сервис → «Закрепить пин в hosts».
# Там два источника адреса: наборы каталога Zapret и «спросить честный
# резолвер сейчас» — он берёт адрес по DoH в момент закрепления, а не
# в день сборки. Для Roblox и TMDB подходит второй.
#
# Свои строки сюда дописывать по-прежнему можно: они применяются через наш
# резолвер, без прав администратора и без правки системного файла.

