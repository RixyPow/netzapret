# Проверка точечного применения VPN к отдельному приложению.
#
# Задача: Telegram ходит через VPN, всё остальное — как обычно, через десинк.
#
# Почему одного правила по процессу мало. Перехват решается по адресу
# назначения: в туннель заходит то, что получило адрес fakeip, то есть
# трафик к доменам из правил. Telegram же соединяется со своими
# дата-центрами по голым IP, без обращения к DNS — его пакеты в туннель
# просто не попадут, и правило по процессу не сработает никогда.
#
# Поэтому диапазоны Telegram заводятся в туннель явно, секцией capture.
# Список берётся из Zapret, он там уже есть и обновляется вместе с ним.

mode: selective

capture:
  - lists/ipset-telegram.txt

rules:
  - match: process
    value: "telegram.exe"
    mode: proxy

  # Десктопный клиент называется по-разному в разных сборках.
  - match: process
    value: "Telegram.exe"
    mode: proxy

default:
  mode: desync
