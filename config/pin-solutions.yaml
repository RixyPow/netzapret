# Готовые решения с пином: адрес прописывается в hosts как есть.
#
# Источник — раздел «Напрямую» каталога hosts Zapret GUI (loop-uh, MIT,
# © censorliber), версия 2026.10.01.1; голос Discord — решение Flowseal;
# картинки Roblox — своё, по замеру 07.10.
# Файл заменяется при обновлении программы: свои пины — в окне пина
# или в catalog.yaml.
#
# desync: true — адрес принадлежит самому сервису или его сети доставки:
# имя в приветствии TLS провайдер режет и там, и десинк такому пину нужен.
# Строка в hosts получает пометку «# nz:desync», и щит её не берёт.
# desync: false — адрес посредника: рецепт, выверенный на настоящей сети,
# рвёт с ним соединение, и щит такой пин держит, как любой другой.
# Замер 06.10, A/B/A на сети владельца: chatgpt.com и notion.so на прокси
# XBOX — со щитом 20 из 20, под рецептом своей секции 0 из 10;
# www.instagram.com, scontent.cdninstagram.com и abs-0.twimg.com на адресах
# из этого файла — со щитом 0 из 22, под рецептом 6 из 6.
#
# needs: ipv6 — без IPv6 решение не предлагается. В остальных адреса IPv6
# пишутся только там, где IPv6 есть.

