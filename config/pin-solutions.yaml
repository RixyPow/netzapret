  # на trns1.rbxcdn.com, а у того записи A нет (DoH к 1.1.1.1, 07.10), и превью
  # предметов не грузятся вовсе. Адрес — раздача самого Roblox за CloudFront
  # (Server: public-gateway, узел HEL51), снятый у пользователя
  # (config/catalog.yaml). Свой, а не посредника, но десинк ему не нужен:
  # замер 07.10 щитом — 3 из 3, TLS 60 мс, сертификат на имя действителен.
