# Ваши маршруты.
#
# Файл ведёт программа: правьте его через меню или командой
#   nz route <что> <напрямую|десинк|vpn>
# Комментарии, добавленные вручную, при следующей записи пропадут.
#
# Эти правила проверяются раньше базовых из rules.yaml, поэтому
# ваш выбор перекрывает заводскую настройку. Выключенная запись
# сохраняется, но не применяется.

rules:
  - match: domain
    value: "canva"
    mode: proxy
    enabled: false
