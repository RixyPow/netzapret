# Правила маршрутизации NetZapret.

# ── Глобальный режим работы ───────────────────────────────────────────────
#
#   off           Ничего не применяется, весь трафик напрямую. Ни один движок
#                 не запускается.
#
#   desync        Только десинк: работает winws2, туннель не поднимается вовсе.
#                 Нужен, когда подписка кончилась или сервер лёг, а десинка
#                 на всё хватает.
#
#   selective     Рабочий режим. По умолчанию всё отдаётся десинку, а прокси
#                 включается точечно — правилами ниже.
#
#   proxy         Весь трафик через VPN, кроме выведенного правилами direct.
#                 Исключения обязательны: российские сервисы через зарубежный
#                 адрес не работают вовсе.
#
#   proxy_strict  Весь трафик через VPN без единого исключения, включая
#                 российские сервисы — они при этом сломаются. Режим нужен
#                 для сравнения, когда надо убедиться, что дело не в правилах.
#
# Локальные сети и loopback остаются прямыми в любом режиме — прописывать их
# правилами не нужно.

mode: selective

# ── Правила ───────────────────────────────────────────────────────────────
#
# Приоритет: сперва все process, затем domain, затем ip. Внутри одного типа
# побеждает то, что записано выше.
#
# Режимы правил:
#   direct — не вмешиваться вообще
#   proxy  — через VPN, поле server задаёт узел или "auto"
#   desync — оставить Zapret'у; трафик гарантированно не заходит в TUN,
#            чтобы WinDivert увидел исходный поток, а не переоткрытый сокет

rules:
  # --- process: матчится по имени процесса, источник имён не нужен ---

  # Игры: прокси добавляет задержку, а десинк ломает античиты.
  - match: process
    value: "somegame.exe"
    mode: direct

  # Полный путь тоже допустим — когда нужно различить одноимённые exe.
  - match: process
    value: "C:\\Program Files\\qBittorrent\\qbittorrent.exe"
    mode: direct

  # --- domain: требует fakeip или --hosts-map в PoC ---

  # То, что не берётся десинком — через VPN.
  - match: domain
    value: "*.rutracker.org"
    mode: proxy
    server: "auto"

  # А это десинк чинит сам, гнать через VPN незачем.
  - match: domain
    value: "*.youtube.com"
    mode: desync

  - match: domain
    value: "*.googlevideo.com"
    mode: desync

# Если default не задан, он вытекает из режима работы:
# selective → desync, proxy → proxy, off → direct.
