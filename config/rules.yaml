# Базовый набор правил NetZapret — «заводские настройки».
#
# Ведётся вместе с программой и обновляется с ней. Свои маршруты сюда
# дописывать не нужно: их место в config/rules.user.yaml, который ведёт меню
# и который проверяется раньше этого файла. Разделение затем и сделано, чтобы
# обновление программы не затирало ваш выбор.
#
# Собрано по результатам blockcheck: через VPN уходит только то, с чем
# не справился десинк. Всё остальное остаётся на нём — это дешевле
# по задержке и не тратит трафик подписки.
#
# Ссылки вида config/lists/... ведут в наши списки: они едут в архиве
# и обновляются вместе с программой. Прежде здесь стояло lists/..., то есть
# файлы установки Zapret; без неё такое правило молча не совпадало ни с чем.
# Старые ссылки на переехавшие списки понимаются по-прежнему.
#
# Посмотреть, куда пойдёт что-то конкретное:
#   nz where telegram.exe
#   nz where rutracker.org

mode: selective

# ── Что заводить в туннель ────────────────────────────────────────────────
#
# Перехват решается по адресу назначения. Приложениям, которые ходят
# по голым IP без DNS, одного правила мало: их трафик просто не дойдёт
# до туннеля. Список диапазонов берётся из Zapret и обновляется вместе с ним.

capture:
  - config/lists/ipset-telegram.txt

rules:
  # ── Российские сервисы: только напрямую ─────────────────────────────────
  #
  # Через VPN они увидят зарубежный адрес: банки и госуслуги начнут требовать
  # подтверждений, часть сервисов откажет вовсе. Десинк им тоже не нужен —
  # они не заблокированы. Правило стоит первым среди адресных, чтобы никакое
  # широкое правило по подсети не увело их в туннель.
  #
  # ВНИМАНИЕ: правила по программе имеют приоритет выше адресных. Если увести
  # в VPN браузер целиком, российские сайты в нём сломаются несмотря на это
  # правило.
  - match: ipset
    value: config/lists/ipset-ru.txt
    mode: direct

  # DonationAlerts — российский, не заблокирован (замер 26.09: напрямую 200
  # за 0,44 с). Без правила ушёл бы на десинк по умолчанию, а десинку тут
  # чинить нечего — только риск сломать виджеты стрима.
  - match: hostlist
    value: config/lists/donationalerts.txt
    mode: direct

  # Авито на своих сетях (176.114.x, 95.181.182.x, 78.159.252.x), и в список
  # российских сетей они не попали — в режиме «всё через VPN» он уходил
  # в туннель, а зарубежный адрес Авито тормозит и отправляет на проверки
  # (жалоба пользователя 28.09). Не заблокирован: замер 28.09 — напрямую
  # рукопожатие за 0,1 с, десинк его не трогает ни одной секцией.
  - match: domain
    value: "*.avito.ru"
    mode: direct

  - match: domain
    value: "*.avito.st"
    mode: direct

  # Steam — напрямую (владелец 29.09: «стим стоял на десинке, хотя по
  # умолчанию должен напрямую»). Без правила он шёл на десинк по умолчанию,
  # и рецепты пресета трогали и сайт, и загрузки — десятки гигабайт, которым
  # десинк ни к чему. Ни одно имя Steam не стоит в реестре блокировок
  # (замер 29.09: russia-blacklist, refilter, other). У владельца оба списка
  # «напрямую» давно, и всё работает. Если у кого-то сообщество замерзает
  # на первых килобайтах (случай в BlockCheck, BlockKind.Stall), — «Сайт
  # не открывается?» в «Маршрутах» переведёт его сам.
  - match: hostlist
    value: config/lists/steam-web.txt
    mode: direct

  - match: hostlist
    value: config/lists/steam.txt
    mode: direct

  # SeriesGraph — не заблокирован, а рецепт пресета рвал загрузку страницы
  # (замер 27.09: 24 КБ пришли, соединение не закрылось и за 20 с). Десинк
  # с рецептом pass — имя winws2 пропускает, секции по адресам остаются:
  # так у владельца, 538 КБ за 0,4 с. Не «напрямую» — см. CLAUDE.md.
  - match: hostlist
    value: config/lists/seriesgraph.txt
    mode: desync
    recipe: "pass"

  # ── Telegram ────────────────────────────────────────────────────────────
  #
  # Правило по адресу, а не по программе: к серверам Telegram обращается
  # не только сам клиент, и трафик, попавший в туннель без совпадения
  # с правилом, ушёл бы в direct и умер. Проверено blockcheck'ом.
  - match: ipset
    value: config/lists/ipset-telegram.txt
    mode: proxy
    server: "auto"

  # ── Не взято десинком, по данным blockcheck ─────────────────────────────
  - match: domain
    value: "*.rutracker.org"
    mode: proxy

  - match: domain
    value: "*.linkedin.com"
    mode: proxy

  - match: domain
    value: "*.bandcamp.com"
    mode: proxy

  # Списки отзыва Let's Encrypt. Windows проверяет по ним каждый сертификат
  # (curl, PowerShell, установщики), и GitHub с 2026 года на Let's Encrypt.
  # Замер 28.09: yr1.c.lencr.org (Cloudflare) замирает на 19,7 КБ из 186 —
  # заморозка ТСПУ, — и GitHub в curl отвечает через 12 с или обрывом
  # CRYPT_E_REVOCATION_OFFLINE; с --ssl-no-revoke тот же GitHub — 0,7 с,
  # а выпуск 113 МБ качается за 6 с. Через туннель список — 0,2 с целиком.
  # Десинку тут ловить нечего: это простой HTTP на 80-м порту.
  - match: domain
    value: "*.lencr.org"
    mode: proxy

  # Canva раздаёт содержимое с отдельных доменов, и одного canva.com мало:
  # страница откроется, а документы и загруженные файлы — нет. Домены,
  # которых у вас не окажется, просто никогда не совпадут.
  - match: domain
    value: "*.canva.com"
    mode: proxy

  - match: domain
    value: "*.canva-user-content.com"
    mode: proxy

  - match: domain
    value: "*.canvausercontent.com"
    mode: proxy

  # Окно входа VirusTotal (Firebase): адрес 199.36.158.100 закрыт, живого
  # для пина нет — замер 26.09 в config/lists/virustotal-login.txt.
  # API Google для того же входа сюда НЕ ставятся: в туннеле браузер
  # не пускает к ним страницу, им нужен пин.
  - match: hostlist
    value: config/lists/virustotal-login.txt
    mode: proxy

  # ChatGPT отказывает по стране, а не по каналу: десинк отрабатывает
  # безупречно — рукопожатие за семь сотых секунды, — и приходит 403
  # от Cloudflare. Помогает только зарубежный выход.
  #
  # Подставлять адрес бесполезно, и это проверено: пин на 104.18.40.165
  # и настоящие 172.64.155.209 с 104.18.32.47 отвечают одинаковым 403.
  # Решение принимается по тому, откуда пришёл запрос, а не по тому,
  # какой узел ответил, — сменой адреса этого не обойти.
  - match: domain
    value: "*.chatgpt.com"
    mode: proxy

  - match: domain
    value: "*.openai.com"
    mode: proxy

  # Как и у Canva, одного основного домена мало. На oaistatic лежат скрипты
  # и стили, на oaiusercontent — вложения: без них страница открывается
  # пустой, и выглядит это поломкой туннеля, а не недостающим правилом.
  - match: domain
    value: "*.oaistatic.com"
    mode: proxy

  - match: domain
    value: "*.oaiusercontent.com"
    mode: proxy

# Всё остальное чинит десинк: YouTube, Discord с голосом, Google, соцсети,
# Spotify — по blockcheck'у они работают.
default:
  mode: desync
