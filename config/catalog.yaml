# Каталог адресов NetZapret.
#
# Сюда дописывается то, чего нет в каталоге Zapret: имена, которые ломаются
# не блокировкой канала, а ответом — заглушкой резолвера, оборванной цепочкой
# CNAME, отказом сети доставки по региону.
#
# Появляется как источник адреса в меню: «Сервисы и маршруты» → сервис →
# «Закрепить пин в hosts».
#
# ── Формат ────────────────────────────────────────────────────────────────
#
#   services:
#     - name: Как показать человеку
#       names: [имена или зоны]
#       resolve: honest          # адрес спросить у DoH в момент закрепления
#
#     - name: Другое
#       names: [ещё.имя]
#       addresses: [1.2.3.4]     # либо назвать адрес прямо
#
# Зона покрывает поддомены: openai.com берёт и api.openai.com.
#
# ── Что выбрать: resolve или addresses ────────────────────────────────────
#
# `resolve: honest` — когда честный ответ существует, но системный резолвер
# его не даёт. Адрес берётся на вашей машине в момент закрепления, а не в день
# сборки, и потому не устаревает. Ответ-петля отбрасывается: это и есть
# та неисправность, которую чиним.
#
# `addresses` — когда честного ответа нет вовсе либо нужен именно чужой узел.
# Помните, что число стареет: у image.tmdb.org живой шард сменился трижды
# за четверо суток.
#
# Ни то ни другое не лечит отказ по стране: там честный адрес самый настоящий,
# и отказ придёт с него же. Для таких сервисов нужен чужой прокси — наборы
# каталога Zapret или туннель.

services:
  # Картинки TMDB. Имя — CNAME на сеть доставки, и та отшивает регион,
  # отдавая петлю 127.0.0.1. Причём не всякому: Google отвечает петлёй,
  # а Cloudflare — живым узлом, с которого картинки грузятся.
  # На этом ломался seriesgraph.com.
  - name: TMDB — картинки
    names:
      - image.tmdb.org
      - tmdb-image-prod.b-cdn.net
    resolve: honest

  # Превью предметов Roblox. Имя долго было оборвано в DNS — CNAME вёл
  # на имя без записи A, — и картинки не грузились вовсе. Сейчас цепочка
  # разрешается до конца, но у пользователя работает именно этот адрес,
  # прибитый вручную, и превью с ним грузятся. Поэтому он назван прямо,
  # а не выведен резолвером: проверено на живой машине.
  - name: Roblox — превью предметов
    names:
      - tr.rbxcdn.com
    addresses:
      - 18.165.140.59

  # То же имя, но адрес спросить самим — если прибитый перестанет отвечать.
  - name: Roblox — превью, свежий адрес
    names:
      - tr.rbxcdn.com
    resolve: honest

  # Valheim. Своего списка у Zapret на него нет, десинк его не касается.
  - name: Valheim
    names:
      - valheim.com
    resolve: honest

  # Telegram. Адрес — из блока, который ведёт редактор Zapret 2 GUI;
  # каталог Zapret этих имён не знает.
  #
  # Оговорка важная: замер показал, что прямое соединение с этим адресом
  # рвут на рукопожатии — как и с настоящим 149.154.167.99. То есть пин
  # сам по себе Telegram не чинит, лечит его туннель. Строка здесь затем,
  # чтобы имена были собраны в одном месте, а не затем, что она достаточна.
  - name: Telegram
    names:
      - t.me
      - telegram.org
      - telegram.me
      - telegram.dog
      - telesco.pe
      - tg.dev
    addresses:
      - 149.154.167.220

  # Crunchyroll — служебные имена. Сайт закрывается от России сам (1009),
  # и пин нужен на каждое имя, которое трогает страница: hosts зон не знает.
  # Замер 23.09 через посредника XBOX DNS: страница www — 200, sso/login — 200,
  # beta-api/index/v2 — 401 «invalid token», то есть ответил сам API; напрямую
  # и sso, и beta-api — 403. Прибиты были только голое имя и www, и страница
  # вставала пустой. static.crunchyroll.com здесь нет намеренно: это CloudFront,
  # напрямую он отдаёт скрипты (200), а посредники его не пропускают.
  #
  # Адрес не назван: автоподбор найдёт живого посредника в момент закрепления.
  - name: Crunchyroll — вход и API
    names:
      - sso.crunchyroll.com
      - beta-api.crunchyroll.com
    resolve: honest

  # VirusTotal — API Google для входа и файлов документации. На своих
  # адресах 172.217.112–119.x все четыре молчат под любым именем; на
  # фронтенде Google (туда же ведёт www.google.com) отвечают за 0,2 с —
  # замер 26.09. Туннель не годится: браузер не пускает страницу к его
  # внутренним адресам. Адрес стареет: при отказе взять тот, в который
  # сейчас разрешается www.google.com.
  - name: VirusTotal — API Google
    names:
      - identitytoolkit.googleapis.com
      - securetoken.googleapis.com
      - www.googleapis.com
      - storage.googleapis.com
    addresses:
      - 142.251.150.119

  # VirusTotal — оформление документации. cdn.readme.io на 104.16.241.118
  # и .242.118 молчит, на соседних узлах Cloudflare отвечает 302 за 0,7 с —
  # замер 26.09.
  - name: VirusTotal — документация
    names:
      - cdn.readme.io
    addresses:
      - 104.18.168.110
      - 104.18.167.110

  # Bluesky — картинки, скрипты приложения и видео. Сеть доставки Bunny,
  # DNS отдаёт случайный узел, и узлы 79.127.134.x в сети владельца мертвы
  # для всех имён: соединение принимают и молчат (замер 26.09). Живые —
  # ниже, каждый отдаёт все четыре имени. На мёртвом узле страница висит
  # на заставке или остаётся без картинок, а видео грузится, когда ему
  # достаётся живой узел. Пин — в «Файл hosts» → «Прибить вручную»:
  # маршрут Bluesky (десинк) при этом не трогается.
  - name: Bluesky — сеть доставки
    names:
      - cdn.bsky.app
      - web-cdn.bsky.app
      - video.bsky.app
      - video.cdn.bsky.app
    addresses:
      - 169.150.247.36
      - 169.150.247.33
      - 138.199.36.8
      - 143.244.56.56
